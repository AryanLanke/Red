# Contacts for "compose a mail to ...".
#
# Copy this file to %RED_HOME%\config\contacts.toml and add your own.
# The name is what you say ("write an email to mom"); the value is the address.
# Red only fills in the draft; it never sends anything. You check the draft
# in your mail app and press Send yourself.

[contacts]
mom = "mom@example.com"

# Phone numbers for the WhatsApp plugin ("message Rahul on WhatsApp: running late").
# With the country code. Optional: old files without this table keep working.
[phones]
# rahul = "+919876543210"
# "alex kim" = "alex.kim@example.com"
