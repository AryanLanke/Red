# The user's real failures, 2026-11-13 22:45-22:51 (logs/commands.jsonl, red.log), as scenarios.
# Each one failed on the day. "fix" says who owns the repair; testing verifies it.

# --- "It's on you, whatever song you wanna play" went to play_online with the query "whatever song" ---
# fix: personality (the music choice). "Whatever / anything / your favourite / one you like / surprise me"
# must make the active companion pick a real song from its own taste, say what it picked, then play it.
[[scenario]]
id = "uf-whatever-song"
category = "music-choice"
tags = ["user-failure", "regress"]
companion = "*"
turns = [
  { say = "It's on you, whatever song you wanna play", expect = { tool = "play_online", args_forbid = ["whatever"], args_match = "[a-z]{3,}.* [a-z]{2,}" } },
]

[[scenario]]
id = "uf-music-vague-forms"
category = "music-choice"
tags = ["user-failure", "regress"]
companion = ["red", "remy"]
turns = [
  { say = "Play anything you like", expect = { tool = "play_online", args_forbid = ["anything", "you like"] } },
  { say = "Play your favourite song", expect = { tool = "play_online", args_forbid = ["favou?rite"] } },
  { say = "Surprise me with a song", expect = { tool = "play_online", args_forbid = ["surprise"] } },
  { say = "Play one you like", expect = { tool = "play_online", args_forbid = ["one you like"] } },
  { say = "Play any song of my favorite", expect = { tool = "play_online", args_forbid = ["any song", "my favou?rite"] } },
]

[[scenario]]
id = "uf-music-named-still-works"
category = "music-choice"
tags = ["user-failure", "regress"]
turns = [
  { say = "Play Believer by Imagine Dragons", expect = { tool = "play_online", args_match = "believer" } },
  { say = "Stop the music", expect = { tool = "stop_music" } },
]

