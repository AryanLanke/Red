# --- "They don't listen": the user said "Switch to Remy" and expected Remy to hear it ---
# (waking on a companion's name is voice mode: see voice-wake.toml; here the text side of it)
[[scenario]]
id = "uf-switch-then-voice-of-new-companion"
category = "switch"
tags = ["user-failure", "regress"]
turns = [
  { say = "Switch to Remy", expect = { companion = "remy", reply_forbid = ["can't do that"] } },
  { say = "How's it going?", expect = { chat = true, companion = "remy" } },
  { say = "Go back to Red", expect = { companion = "red" } },
]

# --- Chat replies logged as "Sorry, I lost my train of thought" (the router's placeholder, not what was said) ---
# The user said these; the reply must be a real one (the log fix is tested in tests/test_sim_log.py).
