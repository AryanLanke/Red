id = "uf-chat-not-placeholder"
category = "chat-basic"
tags = ["user-failure", "regress"]
companion = "*"
turns = [
  { say = "What's up?", expect = { chat = true } },
  { say = "You so mean", expect = { chat = true } },
  { say = "Should I tell you what did you do?", expect = { chat = true } },
  { say = "How are you?", expect = { chat = true } },
]

