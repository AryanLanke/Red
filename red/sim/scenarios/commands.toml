# Real commands: the right tool, the right arguments, a confirmation where one is owed.

[[scenario]]
id = "cmd-open-apps"
category = "command-open"
tags = ["regress"]
turns = [
  { say = "Open Edge", expect = { tool = "open_app", args_match = "edge" } },
  { say = "Open Notepad", expect = { tool = "open_app", args_match = "notepad" } },
  { say = "Launch the calculator", expect = { tool = "open_app", args_match = "calc" } },
  { say = "Open VS Code", expect = { tool = "open_app", args_match = "(code|vs)" } },
]

[[scenario]]
id = "cmd-open-sites-and-folders"
category = "command-open"
tags = ["regress"]
turns = [
  { say = "Open YouTube", expect = { tool = "open_url", args_match = "youtube" } },
  { say = "Open my downloads folder", expect = { tool = "open_folder", args_match = "download" } },
  { say = "Open documents", expect = { tool = "open_folder", args_match = "document" } },
  { say = "Go to github.com", expect = { tool = "open_url", args_match = "github" } },
]

[[scenario]]
id = "cmd-polite-forms"
category = "command-open"
tags = ["regress"]
companion = ["red", "asha"]
turns = [
  { say = "Can you open YouTube for me?", expect = { tool = "open_url", args_match = "youtube" } },
  { say = "Could you open Notepad please", expect = { tool = "open_app", args_match = "notepad" } },
  { say = "Hey, I need the settings page for Bluetooth", expect = { tool = "open_settings" } },
]

[[scenario]]
id = "cmd-music"
category = "command-media"
