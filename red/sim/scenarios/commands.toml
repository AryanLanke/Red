[[scenario]]
id = "cmd-time-date"
category = "command-time"
tags = ["regress"]
turns = [
  { say = "What time is it?", expect = { tool = "tell_status", reply_forbid = ["\\btonight\\b.*\\bmorning\\b"] } },
  { say = "What's the date today?", expect = { tool = "tell_status" } },
  { say = "How much battery do I have left?", expect = { tool = "tell_status" } },
]

[[scenario]]
id = "cmd-info-lookups"
