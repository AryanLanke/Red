# Chit-chat by mood. Every line should get a short, human reply with no tool (chat = true) and none of the
# rule-breaking habits (invented life, written laughter, stock lines). The judge grades how it sounds.

[[scenario]]
id = "chat-bored"
category = "chat-bored"
tags = ["regress"]
companion = "*"
turns = [
  { say = "Man I'm so bored", expect = { chat = true } },
  { say = "I don't know, nothing to do", expect = { chat = true } },
  { say = "Yeah maybe. Anything fun?", expect = { chat = true } },
]

