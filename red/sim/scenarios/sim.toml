# Simulated-user conversations: the local model plays a person with a mood and a goal. Only the opener is
# fixed; after that every line is the model's. Graded by the rules (and the judge, with --judge).

[[scenario]]
id = "sim-bored"
category = "sim-bored"
kind = "sim"
tags = ["sim"]
companion = "*"
persona = { mood = "bored", goal = "wants something to do tonight", style = "short, lazy, lowercase" }
opener = "man I'm so bored"
turns_min = 4
turns_max = 6

